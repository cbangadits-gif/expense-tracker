<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Tests</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; line-height: 1.5; color: #1a1a1a; background: #f1f4f9; }
        h1 { margin-bottom: 0.25rem; }
        h2 { margin: 1.5rem 0 0.5rem; font-size: 1.1rem; }
        #summary { padding: 0.75rem 1rem; border-radius: 8px; font-weight: 700; }
        #summary.pass { background: #e6f4ea; color: #0d652d; }
        #summary.fail { background: #fce8e6; color: #b3261e; }
        ul { list-style: none; padding: 0; margin: 0; background: #fff; border: 1px solid #dadce0; border-radius: 8px; }
        li { padding: 0.4rem 0.75rem; border-top: 1px solid #eee; font-family: ui-monospace, monospace; font-size: 0.9rem; }
        li:first-child { border-top: 0; }
        .ok::before { content: "\2714  PASS  "; color: #0d652d; font-weight: 700; }
        .ko::before { content: "\2718  FAIL  "; color: #b3261e; font-weight: 700; }
        .ko { background: #fff5f4; }
    </style>
</head>
<body>
    <h1>Tests</h1>
    <p>Run automatically when the page loads. Open the console (F12) for details.</p>
    <p id="summary" role="status" aria-live="polite">Running...</p>
    <div id="results"></div>

    <script type="module">
        import {
            RE, validateDescription, validateAmount, validateDate,
            validateCategory, validateId, validateRate, validateCap,
            validateCurrency, validateImport
        } from './scripts/validators.js';
        import { parseJson, DEFAULT_SETTINGS } from './scripts/storage.js'
        import { convert, formatMoney, totalInBase } from './scripts/currency.js'
        let passed = 0;
        let failed = 0;
        const results = document.querySelector('#results');

        function group(title) {
            const h = document.createElement('h2');
            h.textContent = title;
            const ul = document.createElement('ul');
            results.append(h, ul);
            return ul;
        }

        function check(list, label, actual, expected) {
            const good = actual === expected;
            good ? passed++ : failed++;
            const li = document.createElement('li');
            li.className = good ? 'ok' : 'ko';
            li.textContent = `${label} -> expected ${expected}, got ${actual}`;
            list.append(li);
            if (!good) console.error('FAIL:', label);
        }

        const suites = [
            [validateDescription, 'Description', ['Lunch at cafeteria', 'A', 'Bus pass'], ['', ' Lunch', 'Lunch ', 'Bus bus pass']],
            [validateAmount, 'Amount', ['0', '12', '12.5', '12.50', '100'], ['', '012', '1.234', '-5', 'abc', '12.', '1,5']],
            [validateDate, 'Date', ['2026-10-08', '2024-02-29'], ['2026-13-01', '2026-02-30', '2026-1-01', '26-10-01', '2025-02-29', '']],
            [validateCategory, 'Category', ['Food', 'Fast-food', 'Study materials'], ['', 'Food1', 'A  B', '-Food', 'Food-', 'Caf\u00e9']],
            [validateId, 'Id (lookahead)', ['rec_0001', 'rec_42'], ['0001', 'REC_1', 'rec_', '']],
            [validateRate, 'Exchange rate (negative lookahead)', ['1.08', '1', '0.5'], ['0', '0.0', 'abc', '-1', '']],
            [validateCap, 'Spending cap', ['1500', '99.50'], ['0', '', 'abc','-10',]],
            [validateCurrency, 'Currency', ['USD', 'EUR', 'RWF'], ['XYZ', '', 'usd']],
        ];

        for (const [fn, title, valid, invalid] of suites) {
            const list = group(title);
            valid.forEach((v) => check(list, `${title}: "${v}"`, fn(v).valid, true));
            invalid.forEach((v) => check(list, `${title}: "${v}"`, fn(v).valid, false));
        }

        const dup = group('Duplicate word (back-reference)');
        check(dup, '"bus bus pass"', RE.duplicateWord.test('bus bus pass'), true);
        check(dup, '"the Bus bus"', RE.duplicateWord.test('the Bus bus'), true);
        check(dup, '"bus pass"', RE.duplicateWord.test('bus pass'), false);

        const imp = group('JSON import validation');
        const good = { description: 'Lunch', amount: 12.5, currency: 'USD', category: 'Food', date: '2026-10-21' };
        check(imp, 'valid array accepted', validateImport([good]).valid, true);
        check(imp, 'amount given as text accepted', validateImport([{ ...good, amount: '12.50' }]).valid, true);
        check(imp, 'object instead of array refused', validateImport({}).valid, false);
        check(imp, 'null refused', validateImport(null).valid, false);
        check(imp, 'empty array refused', validateImport([]).valid, false);
        check(imp, 'array of numbers refused', validateImport([1, 2]).valid, false);
        check(imp, 'missing description refused', validateImport([{ ...good, description: undefined }]).valid, false);
        check(imp, 'negative amount refused', validateImport([{ ...good, amount: -5 }]).valid, false);
        check(imp, 'unknown currency refused', validateImport([{ ...good, currency: 'XYZ' }]).valid, false);
        check(imp, 'impossible date refused', validateImport([{ ...good, date: '2026-02-30' }]).valid, false);
        check(imp, 'error names the record number',
            validateImport([good, { ...good, amount: 'abc' }]).errors[0].startsWith('Record 2'), true);
        check(imp, 'all problems are reported (2 errors)',
            validateImport([{ ...good, amount: 'abc', date: 'nope' }]).errors.length, 2);

        const json = group('parseJson');
        check(json, 'malformed JSON gives an error', parseJson('{oops').error !== null, true);
        check(json, 'valid JSON is parsed', Array.isArray(parseJson('[]').data), true);

        const cur = group('Currency conversion');
        const rates = DEFAULT_SETTINGS.rates;
        check(cur, 'same currency unchanged', convert(10, 'USD', 'USD', rates), 10);
        check(cur, '10 EUR in USD', Math.round(convert(10, 'EUR', 'USD', rates) * 100) / 100, 10.8);
        check(cur, 'unknown currency gives null', convert(10, 'XYZ', 'USD', rates), null);
        check(cur, 'formatMoney', formatMoney(12.5, 'USD'), '12.50 USD');
        check(cur, 'totalInBase (10 USD + 10 EUR)',
            Math.round(totalInBase([{ amount: 10, currency: 'USD' }, { amount: 10, currency: 'EUR' }],
                { baseCurrency: 'USD', rates }) * 100) / 100, 20.8);

        const seedGroup = group('seed.json');
        try {
            const seed = await (await fetch('./seed.json')).json();
            check(seedGroup, 'has at least 10 records', Array.isArray(seed) && seed.length >= 10, true);
            check(seedGroup, 'passes the import validation', validateImport(seed).valid, true);
        } catch (e) {
            check(seedGroup, `seed.json could not be loaded (${e.message})`, false, true);
        }

        const statsGroup = group('Stats with currency conversion');
        try {
            const { computeStats, lastSevenDays } = await import('./scripts/stats.js');
            const toBase = (record) => record.amount * ({ USD: 1, EUR: 2 }[record.currency] ?? 1);
            const mixed = [
                { category: 'Food', amount: 100, currency: 'EUR', date: '2026-10-21' },
                { category: 'Books', amount: 50, currency: 'USD', date: '2026-10-21' },
            ];
            check(statsGroup, 'total with conversion (100 EUR at 2 + 50 USD)', computeStats(mixed, toBase).total, 250);
            check(statsGroup, 'top category with conversion', computeStats(mixed, toBase).topCategory, 'Food');
            check(statsGroup, 'last 7 days with conversion',
                JSON.stringify(lastSevenDays(mixed, new Date(2026, 9, 21), toBase)), '[0,0,0,0,0,0,250]');
        } catch (e) {
            check(statsGroup, `stats.js could not be tested (${e.message})`, false, true);
        }
        const summary = document.querySelector('#summary');
        summary.textContent = `${passed} passed, ${failed} failed`;
        summary.className = failed === 0 ? 'pass' : 'fail';
    </script>
</body>
</html>
